<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Yorum onayı · dun.not</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
  main{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  h1{font:600 26px var(--sans);margin:24px 0 6px}
  h2{font:600 18px var(--sans);margin:32px 0 10px;border-top:1px solid var(--cizgi);padding-top:18px}
  #kim{font:400 12px var(--mono);color:var(--soluk);overflow-wrap:anywhere}
  .y{background:var(--yuzey);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:0 0 0 1px var(--cizgi-2)}
  .y .ust{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px}
  .y .ust a,.y .ust span{font:400 12px var(--mono);color:var(--soluk)}
  .y p{margin:6px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
  .y .tuslar{margin:0;gap:8px}
  .bos{color:var(--soluk);font-size:14px}
</style>
</head>
<body>
<main>
  <a class="logo" href="./">dun<i>.</i>not</a>
  <h1>Yorum onayı</h1>
  <p id="kim"></p>
  <p style="margin-top:12px"><button class="tus kucuk koyu" id="giris" type="button" hidden><span class="led"></span>Google ile giriş yap</button></p>
  <div id="icerik"></div>
</main>
<script type="module" src="js/onay.js"></script>
</body>
</html>
